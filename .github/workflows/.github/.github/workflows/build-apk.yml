
name: Build Examy Studio PRO APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o Examy_Studio_PRO_Android_Project.zip -d extracted
          find extracted -name gradlew -type f

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          cd extracted/Examy_Studio_PRO_Android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Examy-Studio-PRO-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
