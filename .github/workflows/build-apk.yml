

name: Build Examy Studio PRO APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: unzip -o Examy_Studio_PRO_Android_Project.zip -d extracted

      - name: Build APK
        run: gradle -p extracted/Examy_Studio_PRO_Android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Examy-Studio-PRO-APK
          path: extracted/Examy_Studio_PRO_Android/app/build/outputs/apk/debug/*.apk
